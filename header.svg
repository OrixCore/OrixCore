<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 38" width="100%" height="38">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&amp;display=swap');
      
      .term-base {
        font-family: 'Fira Code', monospace;
        font-size: 13px;
      }
      .line-symbol {
        fill: #4b5263;
        font-weight: 600;
      }
      .text-blue { fill: #61afef; }
      .text-green { fill: #98c379; }

      .typing-text {
        fill: #e06c75;
        font-weight: 600;
        white-space: pre;
        animation: type 8s steps(30) infinite;
      }
      .cursor-block {
        fill: #ffffff;
      }

      @keyframes type {
        0%, 100% { content: ""; }
        5%, 30% { content: "pkg update &amp;&amp; pkg upgrade"; }
        35%, 60% { content: "python3 main.py"; }
        65%, 90% { content: "echo \"Welcome to OrixCore Workspace\""; }
      }
    </style>
  </defs>

  <!-- ==================== السطر الأول (Top Line) ==================== -->
  <text x="0" y="15" class="term-base line-symbol">╭─</text>

  <!-- المستطيل الأيسر (أندرويد + منزل + ~) -->
  <path d="M 22,3 L 102,3 L 110,16 L 102,29 L 22,29 Z" fill="#282c34"/>
  
  <!-- أيقونة أندرويد دقيقة ونظيفة -->
  <g transform="translate(26, 7) scale(0.45)" fill="#abb2bf">
    <path d="M17.6 9.48l1.84-3.18c.16-.27.06-.62-.21-.78-.27-.16-.62-.06-.78.21l-1.87 3.24c-1.32-.58-2.78-.9-4.32-.9s-3 .32-4.32.9L5.08 5.33c-.16-.27-.51-.37-.78-.21-.27.16-.37.51-.21.78l1.84 3.18C3.84 10.95 2.5 13.3 2.5 16h19c0-2.7-1.34-5.05-3.9-6.52zM7 13.5c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1zm10 0c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1z"/>
  </g>

  <!-- أيقونة المنزل الزرقاء بجانب أندرويد مباشرة بدون رموز -->
  <g transform="translate(52, 7) scale(0.48)" fill="#61afef">
    <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>
  </g>

  <!-- رمز ~ -->
  <text x="74" y="18" class="term-base text-blue" font-weight="600">~</text>

  <!-- خط متصل لربط الطرفين -->
  <line x1="104" y1="16" x2="550" y2="16" stroke="#4b5263" stroke-width="1.2" />

  <!-- المستطيل الأيمن (✔) -->
  <path d="M 558,3 L 610,3 L 610,29 L 558,29 L 550,16 Z" fill="#282c34"/>

  <!-- علامة صح الخضراء ✔ -->
  <text x="572" y="18" class="term-base text-green">✔</text>

  <!-- ==================== السطر الثاني (Bottom Line - ملتصق بالكامل) ==================== -->
  <text x="0" y="32" class="term-base line-symbol">╰─</text>

  <!-- مربع المؤشر الأبيض الثابت █ -->
  <rect x="22" y="21" width="7" height="12" class="cursor-block" />

  <!-- النص المتغير -->
  <text x="34" y="32" class="term-base typing-text">
    <tspan id="cmd"></tspan>
  </text>
</svg>
