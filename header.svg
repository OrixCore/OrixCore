<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 32" width="100%" height="32">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&amp;display=swap');
      
      .term-base {
        font-family: 'Fira Code', monospace;
        font-size: 13px;
      }
      .line-symbol {
        fill: #4b5263;
        font-weight: 600;
      }
      .text-blue { fill: #61afef; }
      .text-green { fill: #98c379; }

      .typing-text {
        fill: #e06c75;
        font-weight: 600;
        white-space: pre;
        animation: type 8s steps(30) infinite;
      }
      .cursor-block {
        fill: #ffffff;
      }

      @keyframes type {
        0%, 100% { content: ""; }
        5%, 30% { content: "pkg update &amp;&amp; pkg upgrade"; }
        35%, 60% { content: "python3 main.py"; }
        65%, 90% { content: "echo \"Welcome to OrixCore Workspace\""; }
      }
    </style>
  </defs>

  <!-- ==================== السطر الأول (Top Line) ==================== -->
  <text x="0" y="13" class="term-base line-symbol">╭─</text>

  <!-- المستطيل الأيسر (أندرويد) مع بوردر أبيض شفاف عند الحافة اليمينية المدببة -->
  <path d="M 22,2 L 56,2 L 64,14 L 56,26 L 22,26 Z" fill="#282c34" stroke="rgba(255,255,255,0.25)" stroke-width="0.8"/>
  
  <!-- أيقونة أندرويد دقيقة -->
  <g transform="translate(25, 5) scale(0.42)" fill="#abb2bf">
    <path d="M17.6 9.48l1.84-3.18c.16-.27.06-.62-.21-.78-.27-.16-.62-.06-.78.21l-1.87 3.24c-1.32-.58-2.78-.9-4.32-.9s-3 .32-4.32.9L5.08 5.33c-.16-.27-.51-.37-.78-.21-.27.16-.37.51-.21.78l1.84 3.18C3.84 10.95 2.5 13.3 2.5 16h19c0-2.7-1.34-5.05-3.9-6.52zM7 13.5c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1zm10 0c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1z"/>
  </g>

  <!-- المستطيل الثاني (منزل و ~) مع بوردر أبيض شفاف عند الحافة اليمينية المدببة -->
  <path d="M 64,2 L 105,2 L 113,14 L 105,26 L 64,26 Z" fill="#282c34" stroke="rgba(255,255,255,0.25)" stroke-width="0.8"/>

  <!-- أيقونة المنزل الزرقاء -->
  <g transform="translate(68, 5) scale(0.45)" fill="#61afef">
    <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>
  </g>

  <!-- رمز ~ -->
  <text x="91" y="15" class="term-base text-blue" font-weight="600">~</text>

  <!-- خط متصل لربط الطرفين -->
  <line x1="113" y1="14" x2="550" y2="14" stroke="#4b5263" stroke-width="1.2" />

  <!-- المستطيل الأيمن (✔) مع بوردر أبيض شفاف عند الحافة اليسارية المدببة -->
  <path d="M 550,2 L 595,2 L 603,14 L 595,26 L 550,26 Z" fill="#282c34" stroke="rgba(255,255,255,0.25)" stroke-width="0.8"/>

  <!-- علامة صح الخضراء ✔ -->
  <text x="565" y="15" class="term-base text-green">✔</text>

  <!-- ==================== السطر الثاني (Bottom Line) ==================== -->
  <text x="0" y="27" class="term-base line-symbol">╰─</text>

  <!-- مربع المؤشر الأبيض الثابت █ -->
  <rect x="22" y="17" width="6" height="11" class="cursor-block" />

  <!-- النص المتغير -->
  <text x="32" y="27" class="term-base typing-text">
    <tspan id="cmd"></tspan>
  </text>
</svg>
