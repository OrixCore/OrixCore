<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 52" width="100%" height="52">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&amp;display=swap');
      
      .term-base {
        font-family: 'Fira Code', monospace;
        font-size: 13px;
      }
      .line-symbol {
        fill: #4b5263;
        font-weight: 600;
      }
      .text-white { fill: #abb2bf; }
      .text-blue { fill: #61afef; }
      .text-green { fill: #98c379; }
      .text-muted { fill: #5c6370; }

      .typing-text {
        fill: #e06c75;
        font-weight: 600;
        white-space: pre;
        animation: type 8s steps(30) infinite;
      }
      .cursor-block {
        fill: #ffffff;
      }

      @keyframes type {
        0%, 100% { content: ""; }
        5%, 30% { content: "pkg update &amp;&amp; pkg upgrade"; }
        35%, 60% { content: "python3 main.py"; }
        65%, 90% { content: "echo \"Welcome to OrixCore Workspace\""; }
      }
    </style>
  </defs>

  <!-- ==================== السطر الأول (Top Line) ==================== -->
  <!-- رمز البداية ╭─ -->
  <text x="0" y="20" class="term-base line-symbol">╭─</text>

  <!-- خلفية المستطيل الأيسر الداكن -->
  <path d="M 22,7 L 88,7 L 96,20 L 88,33 L 22,33 Z" fill="#282c34"/>
  
  <!-- أيقونة أندرويد -->
  <g transform="translate(25, 10) scale(0.55)" fill="#abb2bf">
    <path d="M6 18c0 .55.45 1 1 1h1v3c0 .55.45 1 1 1s1-.45 1-1v-3h4v3c0 .55.45 1 1 1s1-.45 1-1v-3h1c.55 0 1-.45 1-1v-7H6v7zM3.5 8C2.67 8 2 8.67 2 9.5v7c0 .83.67 1.5 1.5 1.5S5 17.33 5 16.5v-7C5 8.67 4.33 8 3.5 8zm17 0c-.83 0-1.5.67-1.5 1.5v7c0 .83.67 1.5 1.5 1.5s1.5-.67 1.5-1.5v-7c0-.83-.67-1.5-1.5-1.5zm-4.97-5.84l1.3-1.3c.2-.2.2-.51 0-.71-.2-.2-.51-.2-.71 0l-1.48 1.48C13.38 1.24 12.21 1 11 1c-1.21 0-2.38.24-3.35.63L6.17.15c-.2-.2-.51-.2-.71 0-.2.2-.2.51 0 .71l1.3 1.3C4.98 3.32 3.66 5.41 3.5 7.82h15c-.16-2.41-1.48-4.5-3.47-5.66zM9 5c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1zm6 0c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1z"/>
  </g>

  <!-- أيقونة المنزل الزرقاء -->
  <g transform="translate(45, 11) scale(0.55)" fill="#61afef">
    <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>
  </g>

  <!-- رمز ~ -->
  <text x="66" y="23" class="term-base text-blue" font-weight="600">~</text>

  <!-- خط متصل حقيقي لربط الطرفين -->
  <line x1="96" y1="20" x2="520" y2="20" stroke="#4b5263" stroke-width="1.2" />

  <!-- خلفية المستطيل الأيمن الداكن -->
  <path d="M 528,7 L 610,7 L 610,33 L 528,33 L 520,20 Z" fill="#282c34"/>

  <!-- علامة صح الخضراء ✔ -->
  <text x="533" y="23" class="term-base text-green">✔</text>

  <!-- كلمة NOW كعلامة زمنية ثابتة وبسيطة -->
  <text x="555" y="23" class="term-base text-muted" font-size="11" font-weight="600">NOW</text>

  <!-- ==================== السطر الثاني (Bottom Line) ==================== -->
  <!-- رمز البداية ╰─ -->
  <text x="0" y="42" class="term-base line-symbol">╰─</text>

  <!-- مربع المؤشر الأبيض مصغر البروز (7px × 12px) -->
  <rect x="22" y="32" width="7" height="12" class="cursor-block" />

  <!-- النص المتغير بجانب المؤشر -->
  <text x="34" y="42" class="term-base typing-text">
    <tspan id="cmd"></tspan>
  </text>
</svg>
