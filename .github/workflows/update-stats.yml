name: Update GitHub Stats SVG

on:
  schedule:
    # يعمل تلقائياً كل يوم الساعة 00:00 UTC
    - cron: '0 0 * * *'
  # يتيح لك تشغيله يدوياً في أي وقت
  workflow_dispatch:

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests python-dateutil lxml

      - name: Run Stats Script
        env:
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          USER_NAME: ${{ github.repository_owner }}
        run: |
          python main.py  # استبدل main.py باسم ملف البايثون الخاص بك إن كان مختلفاً

      - name: Commit and Push Changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add cache/ *.svg
          git diff-index --quiet HEAD || git commit -m "Chore: Update GitHub stats SVG"
          git push
