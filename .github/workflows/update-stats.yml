name: Update GitHub Stats SVG

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  update-stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write # هذه الصلاحية تسمح للبوت بكتابة ورفع التغييرات
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.ACCESS_TOKEN }} # استخدام التوكن الخاص بك للتأكد من المزامنة

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests python-dateutil lxml

      - name: Run Stats Script
        env:
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          USER_NAME: ${{ github.repository_owner }}
        run: |
          python main.py # تأكد من اسم ملف بايثون لديك

      - name: Commit and Push Changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add cache/ *.svg
          git diff-index --quiet HEAD || git commit -m "Chore: Update GitHub stats SVG"
          git push
