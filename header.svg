<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 65" width="100%" height="65">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@500;700&amp;display=swap');
      
      .term-text {
        font-family: 'Fira Code', monospace;
        font-size: 13px;
        fill: #e6edf3;
      }
      .prompt-symbol {
        font-family: 'Fira Code', monospace;
        font-size: 13px;
        font-weight: 700;
        fill: #8b949e;
      }
      .typing-text {
        font-family: 'Fira Code', monospace;
        font-size: 13px;
        font-weight: 500;
        fill: #3fb950;
        white-space: pre;
        animation: type 9s steps(40) infinite;
      }
      .cursor {
        animation: blink 0.8s infinite;
        fill: #3fb950;
      }

      @keyframes type {
        0%, 100% { content: ""; }
        5%, 30% { content: "pkg update &amp;&amp; pkg upgrade"; }
        35%, 60% { content: "python3 main.py"; }
        65%, 90% { content: "echo \"Welcome to Termux\""; }
      }

      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
    </style>
  </defs>

  <!-- السطر الأول: Prompt Line -->
  <!-- رمز Bending اليساري -->
  <text x="0" y="20" class="prompt-symbol">╭─</text>

  <!-- الجزء الأول: مستطيل أندرويد رمادي مغلق بحواف منحنية من اليسار -->
  <path d="M 22,7 L 50,7 L 50,25 L 22,25 A 3,3 0 0 1 19,22 L 19,10 A 3,3 0 0 1 22,7 Z" fill="#2d333b"/>
  
  <!-- أيقونة أندرويد vector حقيقية داخل المستطيل -->
  <g transform="translate(25, 10) scale(0.55)" fill="#ffffff">
    <path d="M6 18c0 .55.45 1 1 1h1v3c0 .55.45 1 1 1s1-.45 1-1v-3h4v3c0 .55.45 1 1 1s1-.45 1-1v-3h1c.55 0 1-.45 1-1v-7H6v7zM3.5 8C2.67 8 2 8.67 2 9.5v7c0 .83.67 1.5 1.5 1.5S5 17.33 5 16.5v-7C5 8.67 4.33 8 3.5 8zm17 0c-.83 0-1.5.67-1.5 1.5v7c0 .83.67 1.5 1.5 1.5s1.5-.67 1.5-1.5v-7c0-.83-.67-1.5-1.5-1.5zm-4.97-5.84l1.3-1.3c.2-.2.2-.51 0-.71-.2-.2-.51-.2-.71 0l-1.48 1.48C13.38 1.24 12.21 1 11 1c-1.21 0-2.38.24-3.35.63L6.17.15c-.2-.2-.51-.2-.71 0-.2.2-.2.51 0 .71l1.3 1.3C4.98 3.32 3.66 5.41 3.5 7.82h15c-.16-2.41-1.48-4.5-3.47-5.66zM9 5c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1zm6 0c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1z"/>
  </g>

  <!-- سهم Powerline المثلث المتموج الأول (Transition to Blue) -->
  <path d="M 50,7 L 60,16 L 50,25 Z" fill="#2d333b"/>
  <path d="M 50,7 L 60,16 L 50,25 Z" fill="#0969da"/>

  <!-- الجزء الثاني: مستطيل المجلد الحامل لعلامة ~ -->
  <rect x="50" y="7" width="22" height="18" fill="#0969da"/>
  <text x="57" y="20" class="term-text" font-weight="bold">~</text>

  <!-- سهم Powerline المثلث الخارجي للشفافية -->
  <path d="M 72,7 L 82,16 L 72,25 Z" fill="#0969da"/>

  <!-- السطر الثاني: السهم $ والتايبنج المتحرك -->
  <text x="0" y="50" class="prompt-symbol">╰─ $</text>
  
  <!-- النص المتغير بالأنميشن -->
  <text x="35" y="50" class="typing-text">
    <tspan id="cmd"></tspan>
  </text>

  <!-- Script للأمر المتغير لضمان التوافقية العالية -->
  <script type="text/type">
    // CSS fallback text handler
  </script>
</svg>
